version: '3.8'

services:
  mock-gateway:
    image: python:3.11-alpine
    container_name: falsify-demo-gateway
    command: python -m http.server 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  mock-payment-service:
    image: python:3.11-alpine
    container_name: falsify-demo-payment
    command: python -m http.server 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  mock-order-service:
    image: python:3.11-alpine
    container_name: falsify-demo-orders
    command: python -m http.server 8002
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  mock-database:
    image: python:3.11-alpine
    container_name: falsify-demo-db
    command: python -m http.server 8003
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
