name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    name: Unit Tests & Repo Verification
    runs-on: ubuntu-latest
    env:
      REPLAY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run repository integrity check
        run: python scripts/check_repo.py

      - name: Run unit tests
        run: pytest -m "not integration" -q

  integration:
    name: Integration Tests & Docker Compose
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Docker Compose services
        run: docker compose up -d --wait

      - name: Run integration tests
        run: |
          status=0
          pytest -m integration || status=$?
          if [ $status -eq 5 ]; then
            echo "No integration tests collected yet (exit code 5). Treating as success until integration tests are added."
            exit 0
          elif [ $status -ne 0 ]; then
            echo "Integration tests failed with exit code $status"
            exit $status
          fi

      - name: Collect Docker Compose logs on failure
        if: failure()
        run: docker compose logs > docker-compose.log

      - name: Upload Compose logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log

      - name: Teardown Docker Compose services
        if: always()
        run: docker compose down -v
